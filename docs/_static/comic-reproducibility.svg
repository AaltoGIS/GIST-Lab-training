<svg width="1080" height="340" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-label="Three-panel comic about changing AI outputs and preserving an auditable record of prompts, outputs, dates, and edits">
  <defs>
    <style>
      .REPRO-panel{stroke:#1e292e;stroke-width:5;stroke-linejoin:round}
      .REPRO-ink{stroke:#1e292e;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .REPRO-thin{stroke:#1e292e;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .REPRO-skin{fill:#d99568}
      .REPRO-hair{fill:#533a30}
      .REPRO-teal{fill:#27a6a1}
      .REPRO-blue{fill:#408ac9}
      .REPRO-orange{fill:#f19a3e}
      .REPRO-paper{fill:#fffdf8}
      .REPRO-balloon{fill:#fff;stroke:#1e292e;stroke-width:3}
      .REPRO-text{font-family:"Trebuchet MS",Arial,sans-serif;font-size:18px;font-weight:700;fill:#1e292e}
      .REPRO-small{font-family:"Trebuchet MS",Arial,sans-serif;font-size:13px;font-weight:700;fill:#1e292e}
      .REPRO-caption{font-family:Georgia,serif;font-size:15px;font-style:italic;fill:#1e292e}
    </style>
  </defs>

  <!-- Panel 1 -->
  <rect class="REPRO-panel" x="8" y="8" width="343" height="324" rx="8" fill="#eef8f6"/>
  <text class="REPRO-small" x="28" y="31">MONDAY</text>
  <ellipse cx="178" cy="306" rx="146" ry="14" fill="#cfe4e0"/>

  <path class="REPRO-balloon" d="M87 24h225a11 11 0 0 1 11 11v43a11 11 0 0 1-11 11H191l-18 20-5-20H87a11 11 0 0 1-11-11V35a11 11 0 0 1 11-11z"/>
  <text class="REPRO-text" x="199" y="62" text-anchor="middle">Run this analysis, please.</text>

  <!-- Researcher -->
  <circle cx="72" cy="164" r="32" class="REPRO-skin REPRO-ink"/>
  <path d="M41 164q-1-42 33-42 31 0 31 35-17-2-29-19-9 18-35 26z" class="REPRO-hair REPRO-ink"/>
  <circle cx="61" cy="166" r="3" fill="#1e292e"/>
  <circle cx="84" cy="166" r="3" fill="#1e292e"/>
  <path d="M61 182q11 8 22 0" fill="none" class="REPRO-thin"/>
  <path d="M29 294q3-76 44-76t48 76z" class="REPRO-orange REPRO-ink"/>
  <path d="M103 235l34 22M46 236l-23 25" fill="none" class="REPRO-ink"/>

  <!-- AI computer and map A -->
  <rect x="137" y="132" width="180" height="123" rx="7" class="REPRO-blue REPRO-ink"/>
  <rect x="150" y="145" width="154" height="95" rx="3" fill="#fffdf8"/>
  <path d="M160 217l24-53 30 22 25-28 54 31" fill="none" stroke="#b9c9c8" stroke-width="3"/>
  <path d="M164 151q38 22 29 78M233 148q-13 45 4 85M284 154q-36 35-14 78" fill="none" stroke="#b9c9c8" stroke-width="2"/>
  <circle cx="207" cy="183" r="25" fill="#408ac9" fill-opacity=".36"/>
  <circle cx="207" cy="183" r="14" fill="#408ac9" fill-opacity=".65"/>
  <circle cx="207" cy="183" r="6" fill="#408ac9"/>
  <circle cx="278" cy="208" r="14" fill="#27a6a1" fill-opacity=".5"/>
  <path d="M128 255h197l17 19H111z" fill="#c4d1d6" class="REPRO-ink"/>

  <g transform="translate(287 119)">
    <rect x="-24" y="-21" width="48" height="39" rx="8" class="REPRO-teal REPRO-ink"/>
    <circle cx="-9" cy="-7" r="3" fill="#fff"/>
    <circle cx="9" cy="-7" r="3" fill="#fff"/>
    <path d="M-9 6q9 6 18 0" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0-21v-10" class="REPRO-ink"/>
    <circle cx="0" cy="-34" r="4" class="REPRO-orange REPRO-thin"/>
  </g>

  <!-- Panel 2 -->
  <rect class="REPRO-panel" x="369" y="8" width="343" height="324" rx="8" fill="#fff4e8"/>
  <text class="REPRO-small" x="389" y="31">FRIDAY</text>
  <ellipse cx="540" cy="306" rx="146" ry="14" fill="#e5d7c5"/>

  <path class="REPRO-balloon" d="M395 24h176a11 11 0 0 1 11 11v43a11 11 0 0 1-11 11h-77l-16 20-7-20h-76a11 11 0 0 1-11-11V35a11 11 0 0 1 11-11z"/>
  <text class="REPRO-text" x="483" y="53" text-anchor="middle">Same prompt...</text>
  <text class="REPRO-text" x="483" y="75" text-anchor="middle">different map?</text>

  <!-- Shocked researcher -->
  <circle cx="431" cy="167" r="32" class="REPRO-skin REPRO-ink"/>
  <path d="M400 166q-1-41 33-41 31 0 31 34-17-1-29-18-9 17-35 25z" class="REPRO-hair REPRO-ink"/>
  <circle cx="420" cy="168" r="5" fill="#fff" class="REPRO-thin"/>
  <circle cx="443" cy="168" r="5" fill="#fff" class="REPRO-thin"/>
  <circle cx="420" cy="168" r="2" fill="#1e292e"/>
  <circle cx="443" cy="168" r="2" fill="#1e292e"/>
  <ellipse cx="432" cy="186" rx="7" ry="9" fill="#fff" class="REPRO-thin"/>
  <path d="M389 294q3-76 43-76t48 76z" class="REPRO-orange REPRO-ink"/>
  <path d="M405 233l-25-22M458 233l24-23" fill="none" class="REPRO-ink"/>

  <!-- Changed AI computer and map B -->
  <rect x="499" y="132" width="181" height="123" rx="7" class="REPRO-blue REPRO-ink"/>
  <rect x="512" y="145" width="155" height="95" rx="3" fill="#fffdf8"/>
  <path d="M522 217l24-53 30 22 25-28 54 31" fill="none" stroke="#b9c9c8" stroke-width="3"/>
  <path d="M526 151q38 22 29 78M595 148q-13 45 4 85M646 154q-36 35-14 78" fill="none" stroke="#b9c9c8" stroke-width="2"/>
  <circle cx="622" cy="177" r="26" fill="#f19a3e" fill-opacity=".38"/>
  <circle cx="622" cy="177" r="15" fill="#f19a3e" fill-opacity=".68"/>
  <circle cx="622" cy="177" r="6" fill="#f19a3e"/>
  <circle cx="545" cy="213" r="15" fill="#e85b4f" fill-opacity=".45"/>
  <path d="M490 255h198l17 19H473z" fill="#c4d1d6" class="REPRO-ink"/>

  <!-- New model -->
  <g transform="translate(649 113)">
    <rect x="-27" y="-23" width="54" height="43" rx="9" class="REPRO-teal REPRO-ink"/>
    <circle cx="-10" cy="-7" r="3" fill="#fff"/>
    <circle cx="10" cy="-7" r="3" fill="#fff"/>
    <path d="M-10 7q10 7 20 0" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M0-23v-11" class="REPRO-ink"/>
    <circle cx="0" cy="-38" r="5" class="REPRO-orange REPRO-thin"/>
    <rect x="-42" y="20" width="84" height="25" rx="4" class="REPRO-paper REPRO-thin"/>
    <text class="REPRO-small" x="0" y="37" text-anchor="middle">NEW MODEL</text>
  </g>

  <!-- Panel 3 -->
  <rect class="REPRO-panel" x="730" y="8" width="342" height="324" rx="8" fill="#eef4fb"/>
  <ellipse cx="901" cy="307" rx="145" ry="14" fill="#d3dfec"/>

  <path class="REPRO-balloon" d="M752 23h289a12 12 0 0 1 12 12v48a12 12 0 0 1-12 12H894l-19 23-6-23H752a12 12 0 0 1-12-12V35a12 12 0 0 1 12-12z"/>
  <text class="REPRO-text" x="897" y="53" text-anchor="middle">Luckily, I kept</text>
  <text class="REPRO-text" x="897" y="77" text-anchor="middle">the receipts.</text>

  <!-- Researcher proudly presenting archive -->
  <circle cx="788" cy="176" r="31" class="REPRO-skin REPRO-ink"/>
  <path d="M758 176q0-40 32-40 30 0 30 34-17-1-28-17-9 17-34 23z" class="REPRO-hair REPRO-ink"/>
  <circle cx="778" cy="178" r="3" fill="#1e292e"/>
  <circle cx="800" cy="178" r="3" fill="#1e292e"/>
  <path d="M778 193q11 8 22 0" fill="none" class="REPRO-thin"/>
  <path d="M750 298q2-75 39-75t44 75z" class="REPRO-orange REPRO-ink"/>
  <path d="M810 238l39 22M765 238l-21 24" fill="none" class="REPRO-ink"/>

  <!-- Audit cart -->
  <rect x="838" y="258" width="205" height="28" rx="5" class="REPRO-teal REPRO-ink"/>
  <path d="M854 286v14M1027 286v14" class="REPRO-ink"/>
  <circle cx="854" cy="304" r="9" fill="#fff" class="REPRO-ink"/>
  <circle cx="1027" cy="304" r="9" fill="#fff" class="REPRO-ink"/>

  <g transform="rotate(-4 883 207)">
    <rect x="846" y="132" width="75" height="128" rx="4" class="REPRO-paper REPRO-ink"/>
    <rect x="854" y="143" width="59" height="22" class="REPRO-blue REPRO-thin"/>
    <text class="REPRO-small" x="883" y="159" text-anchor="middle" fill="#fff">PROMPT</text>
    <path d="M858 177h49M858 188h39M858 199h45M858 210h31" class="REPRO-thin"/>
    <text class="REPRO-small" x="883" y="242" text-anchor="middle">MONDAY</text>
  </g>

  <g transform="rotate(3 942 206)">
    <rect x="907" y="124" width="75" height="136" rx="4" class="REPRO-paper REPRO-ink"/>
    <rect x="915" y="135" width="59" height="22" class="REPRO-orange REPRO-thin"/>
    <text class="REPRO-small" x="944" y="151" text-anchor="middle" fill="#fff">OUTPUT</text>
    <circle cx="944" cy="191" r="24" fill="#408ac9" fill-opacity=".35"/>
    <circle cx="944" cy="191" r="10" fill="#408ac9"/>
    <path d="M920 223h48M920 234h37" class="REPRO-thin"/>
  </g>

  <g transform="rotate(-2 1002 205)">
    <rect x="968" y="139" width="69" height="121" rx="4" class="REPRO-paper REPRO-ink"/>
    <rect x="976" y="150" width="53" height="22" class="REPRO-teal REPRO-thin"/>
    <text class="REPRO-small" x="1002" y="166" text-anchor="middle" fill="#fff">DIFF</text>
    <path d="M981 185h42M981 197h32M981 209h39" stroke="#27a6a1" stroke-width="4" stroke-linecap="round"/>
    <path d="M981 224h37M981 236h25" stroke="#e85b4f" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Retired model departing -->
  <g transform="translate(1042 117) scale(.72)">
    <rect x="-26" y="-20" width="52" height="39" rx="8" class="REPRO-blue REPRO-ink"/>
    <circle cx="-9" cy="-6" r="3" fill="#fff"/>
    <circle cx="9" cy="-6" r="3" fill="#fff"/>
    <path d="M-9 7q9 5 18 0" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M-16 19l-8 34M16 19l8 34M26-5l20-18" fill="none" class="REPRO-ink"/>
    <rect x="-42" y="52" width="84" height="25" rx="4" class="REPRO-paper REPRO-thin"/>
    <text class="REPRO-small" x="0" y="69" text-anchor="middle">RETIRED</text>
  </g>
</svg>