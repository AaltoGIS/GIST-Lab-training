<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="testTitle testDesc">
  <title id="testTitle">Testing and packaging research software</title>
  <desc id="testDesc">A three-panel comic in which a software test reveals double-counted rows.</desc>
  <defs>
    <linearGradient id="testWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f1f3ed"/>
    </linearGradient>
    <linearGradient id="testMonitor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf8fb"/>
      <stop offset="1" stop-color="#cce8ea"/>
    </linearGradient>
    <filter id="testShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="2" flood-color="#263238" flood-opacity=".22"/>
    </filter>
    <style>
      .test-panel{fill:url(#testWall);stroke:#1e292e;stroke-width:4;stroke-linejoin:round}
      .test-ink{stroke:#1e292e;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .test-thin{stroke:#1e292e;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .test-balloon{fill:#fff;stroke:#1e292e;stroke-width:3;stroke-linejoin:round;filter:url(#testShadow)}
      .test-talk{font-family:"Trebuchet MS",Arial,sans-serif;font-size:15px;font-weight:700;fill:#1e292e;text-anchor:middle}
      .test-code{font-family:"Courier New",monospace;font-size:10px;font-weight:700;fill:#29424b}
      .test-caption{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-weight:700;font-style:italic;fill:#1e292e;text-anchor:middle}
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="360" rx="10" fill="#fffefb"/>
  <rect class="test-panel" x="12" y="12" width="282" height="305" rx="3"/>
  <rect class="test-panel" x="309" y="12" width="282" height="305" rx="3"/>
  <rect class="test-panel" x="606" y="12" width="282" height="305" rx="3"/>

  <!-- PANEL 1 -->
  <path d="M16 261 Q75 247 135 258 T290 248 L290 313 L16 313Z" fill="#e7e5cf"/>
  <rect x="29" y="30" width="230" height="64" rx="27" class="test-balloon"/>
  <path d="M102 89 Q111 108 127 116 Q105 113 89 92Z" class="test-balloon"/>
  <text class="test-talk" x="144" y="56">
    <tspan x="144">“Significant! Into the</tspan>
    <tspan x="144" dy="20">paper it goes.”</tspan>
  </text>

  <!-- Delighted researcher -->
  <path d="M50 214 Q54 184 84 181 Q117 181 124 215 L121 276 H46Z" fill="#e88454" class="test-ink"/>
  <path d="M74 178 L74 191 Q84 199 96 189 L96 174Z" fill="#d99a72" class="test-ink"/>
  <ellipse cx="85" cy="149" rx="32" ry="35" fill="#d99a72" class="test-ink"/>
  <path d="M54 148 Q49 124 65 114 Q87 100 108 117 Q119 126 117 146 Q103 135 98 121 Q83 136 55 135Z" fill="#4b3430" class="test-ink"/>
  <path d="M64 147 q5-6 12 0 M94 147 q6-6 13 0" fill="none" class="test-thin"/>
  <path d="M67 157 Q84 176 104 156 Q100 180 85 181 Q69 179 67 157Z" fill="#fff" class="test-ink"/>
  <path d="M68 159 Q84 166 103 158" stroke="#d87868" stroke-width="2" fill="none"/>
  <!-- Celebratory arm -->
  <path d="M56 202 Q39 189 37 166" fill="none" stroke="#e88454" stroke-width="17" stroke-linecap="round"/>
  <path d="M37 168 Q29 158 35 148 Q41 154 44 162 M36 153 l-5-10 M38 153 l3-12" fill="#d99a72" class="test-ink"/>
  <!-- Chair -->
  <path d="M43 224 Q31 225 32 242 L34 284 M34 268 H88 M41 268 L35 293 M80 268 L86 293" fill="none" class="test-ink"/>

  <!-- Chart monitor -->
  <rect x="131" y="128" width="137" height="113" rx="8" fill="#49616b" class="test-ink" filter="url(#testShadow)"/>
  <rect x="141" y="138" width="117" height="91" rx="3" fill="url(#testMonitor)" class="test-thin"/>
  <path d="M152 214 V151 M152 214 H246" class="test-thin" fill="none"/>
  <rect x="163" y="190" width="14" height="24" fill="#5ba7c2" class="test-thin"/>
  <rect x="185" y="174" width="14" height="40" fill="#5ba7c2" class="test-thin"/>
  <rect x="207" y="154" width="14" height="60" fill="#e67d57" class="test-thin"/>
  <rect x="229" y="144" width="14" height="70" fill="#e67d57" class="test-thin"/>
  <path d="M159 185 Q182 179 197 165 T239 145" fill="none" stroke="#267b54" stroke-width="3"/>
  <circle cx="239" cy="145" r="4" fill="#267b54"/>
  <text x="201" y="224" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#267b54" text-anchor="middle">p &lt; 0.001</text>
  <path d="M191 241 V258 M170 261 H216" class="test-ink" fill="none"/>
  <path d="M154 261 H230 L237 271 H148Z" fill="#758b92" class="test-ink"/>
  <!-- Excitement rays -->
  <path d="M255 112 l11-10 M266 119 l14-3 M245 104 l3-14" stroke="#e4ae2c" stroke-width="4" stroke-linecap="round"/>

  <!-- PANEL 2 -->
  <path d="M313 260 Q374 251 431 257 T587 249 L587 313 L313 313Z" fill="#e2ebdf"/>
  <rect x="329" y="29" width="239" height="66" rx="27" class="test-balloon"/>
  <path d="M465 89 Q459 106 445 118 Q469 111 483 92Z" class="test-balloon"/>
  <text class="test-talk" x="449" y="55">
    <tspan x="449">“Your code counts</tspan>
    <tspan x="449" dy="20">every row twice.”</tspan>
  </text>

  <!-- Co-author -->
  <path d="M336 216 Q343 185 373 184 Q405 185 411 217 L407 279 H331Z" fill="#4d8291" class="test-ink"/>
  <path d="M363 180 L363 193 Q374 201 385 191 L385 177Z" fill="#8f5f43" class="test-ink"/>
  <ellipse cx="374" cy="150" rx="31" ry="34" fill="#8f5f43" class="test-ink"/>
  <path d="M345 146 Q342 122 356 112 Q377 101 398 116 Q409 126 404 147 Q393 131 383 121 Q368 137 346 136Z" fill="#272a30" class="test-ink"/>
  <path d="M353 143 l14-3 M383 140 l14 3" class="test-thin" fill="none"/>
  <rect x="351" y="145" width="19" height="13" rx="5" fill="none" class="test-thin"/>
  <rect x="379" y="145" width="19" height="13" rx="5" fill="none" class="test-thin"/>
  <path d="M370 151 H379" class="test-thin"/>
  <circle cx="361" cy="151" r="2" fill="#1e292e"/>
  <circle cx="389" cy="151" r="2" fill="#1e292e"/>
  <path d="M363 170 Q374 164 386 170" fill="none" class="test-thin"/>
  <!-- Arm holding magnifier -->
  <path d="M400 207 Q421 212 438 229" fill="none" stroke="#4d8291" stroke-width="17" stroke-linecap="round"/>
  <path d="M436 227 L451 240" stroke="#1e292e" stroke-width="7" stroke-linecap="round"/>
  <circle cx="466" cy="253" r="22" fill="#d7f1f6" fill-opacity=".55" stroke="#1e292e" stroke-width="5"/>

  <!-- Code sheet enlarged under glass -->
  <path d="M432 228 L521 218 L529 286 L440 296Z" fill="#fff" class="test-ink" filter="url(#testShadow)"/>
  <text class="test-code" transform="rotate(-6 474 253)">
    <tspan x="443" y="243">for row in data:</tspan>
    <tspan x="449" y="257">total += row</tspan>
    <tspan x="449" y="271" fill="#cf4949">total += row</tspan>
  </text>
  <path d="M453 273 Q477 282 510 269" fill="none" stroke="#cf4949" stroke-width="3"/>
  <path d="M509 269 l-6-4 M509 269 l-4 7" stroke="#cf4949" stroke-width="3"/>

  <!-- Shocked researcher peeking from right -->
  <path d="M521 219 Q528 196 554 195 Q574 198 586 219 L587 280 H523Z" fill="#e88454" class="test-ink"/>
  <path d="M540 191 L541 202 Q551 207 560 198 L560 187Z" fill="#d99a72" class="test-ink"/>
  <ellipse cx="551" cy="164" rx="27" ry="31" fill="#d99a72" class="test-ink"/>
  <path d="M526 160 Q523 136 543 131 Q564 126 577 147 Q565 140 560 134 Q549 144 527 146Z" fill="#4b3430" class="test-ink"/>
  <path d="M533 154 l10-5 M558 149 l10 5" class="test-thin" fill="none"/>
  <ellipse cx="540" cy="160" rx="3.5" ry="5" fill="#1e292e"/>
  <ellipse cx="562" cy="160" rx="3.5" ry="5" fill="#1e292e"/>
  <ellipse cx="551" cy="178" rx="7" ry="9" fill="#fff" class="test-thin"/>
  <path d="M518 137 l-10-12 M521 127 l-1-17 M581 137 l7-13" stroke="#cf4949" stroke-width="4" stroke-linecap="round"/>

  <!-- PANEL 3 -->
  <path d="M610 260 Q673 249 733 257 T884 248 L884 313 L610 313Z" fill="#e1ebe6"/>
  <rect x="624" y="29" width="245" height="65" rx="27" class="test-balloon"/>
  <path d="M717 89 Q724 106 742 117 Q718 112 701 92Z" class="test-balloon"/>
  <text class="test-talk" x="747" y="55">
    <tspan x="747">“A test would have</tspan>
    <tspan x="747" dy="20">caught that.”</tspan>
  </text>

  <!-- Sheepish researcher -->
  <path d="M630 216 Q637 188 669 187 Q702 188 710 220 L706 281 H626Z" fill="#e88454" class="test-ink"/>
  <path d="M657 183 L657 196 Q668 204 680 194 L680 180Z" fill="#d99a72" class="test-ink"/>
  <ellipse cx="669" cy="153" rx="32" ry="35" fill="#d99a72" class="test-ink"/>
  <path d="M639 149 Q635 126 650 115 Q672 102 693 119 Q704 128 701 148 Q687 137 682 123 Q667 139 640 137Z" fill="#4b3430" class="test-ink"/>
  <!-- Sheepish eyes and smile -->
  <path d="M648 149 Q655 145 662 150 M678 150 Q685 145 692 151" fill="none" class="test-thin"/>
  <circle cx="656" cy="152" r="2" fill="#1e292e"/>
  <circle cx="685" cy="152" r="2" fill="#1e292e"/>
  <path d="M658 171 Q669 177 681 169" fill="none" class="test-thin"/>
  <path d="M640 181 q-11 8-13 20" fill="none" class="test-thin"/>
  <!-- Hand rubbing neck -->
  <path d="M701 205 Q712 187 697 174" fill="none" stroke="#e88454" stroke-width="16" stroke-linecap="round"/>
  <path d="M699 176 q3-12-6-17 q-5 10 1 19" fill="#d99a72" class="test-ink"/>

  <!-- Passing-test monitor -->
  <rect x="724" y="130" width="143" height="119" rx="8" fill="#49616b" class="test-ink" filter="url(#testShadow)"/>
  <rect x="735" y="141" width="121" height="96" rx="4" fill="#edf8f1" class="test-thin"/>
  <rect x="746" y="153" width="99" height="28" rx="6" fill="#3a9d61"/>
  <path d="M759 166 l7 7 14-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="812" y="171" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">PASSED</text>
  <text class="test-code" x="746" y="198">test_row_count ✓</text>
  <text class="test-code" x="746" y="215">test_total     ✓</text>
  <text x="795" y="231" font-family="Arial,sans-serif" font-size="9" font-weight="700" fill="#267b54" text-anchor="middle">2 passed in 0.08s</text>
  <path d="M791 249 V266 M768 269 H816" class="test-ink" fill="none"/>
  <path d="M751 269 H833 L840 280 H744Z" fill="#758b92" class="test-ink"/>
  <!-- Success sparkle -->
  <path d="M850 111 v18 M841 120 h18" stroke="#3a9d61" stroke-width="4" stroke-linecap="round"/>
  <path d="M824 112 l-7-8 M827 107 l2-11" stroke="#e4ae2c" stroke-width="3" stroke-linecap="round"/>

  <text class="test-caption" x="450" y="344">A test catches the bug that looks right.</text>
</svg>